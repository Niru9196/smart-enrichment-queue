services:
  db:
    image: postgres:16-alpine
    container_name: seq-postgres
    environment:
      POSTGRES_USER: seq
      POSTGRES_PASSWORD: seq
      POSTGRES_DB: seq_dev
    ports:
      - '5433:5432'
    volumes:
      - seq-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seq -d seq_dev']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  seq-pgdata:
