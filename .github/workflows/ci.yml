name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seq
          POSTGRES_PASSWORD: seq
          POSTGRES_DB: seq_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U seq -d seq_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://seq:seq@localhost:5433/seq_test
      E2E_DATABASE_URL: postgresql://seq:seq@localhost:5433/seq_test
      # Build-time placeholders; tests and E2E set their own database URLs.
      DATABASE_URL: postgresql://seq:seq@localhost:5433/seq_test
      DIRECT_URL: postgresql://seq:seq@localhost:5433/seq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
